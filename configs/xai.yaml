# Experiment configuration. The three paths point to Py4Cast assets that are
# not distributed with this repository (see README).
dataset_path: config/dataset.yaml   # Py4Cast dataset config ("data" section); batch_size must be 1
model_path: config/model.yaml       # Py4Cast model config ("model" section)
ckpt_path: config/model.ckpt        # trained Py4Cast checkpoint
weights_path: null                  # optional state dict loaded instead of the checkpoint weights

mode: explain        # infer | explain | compare | eval | time | centroid | transport | precip
seed: 42
output_dir: outputs

# The explained quantity is the `output` field at the last lead time
# (num_pred_steps_val_test in the dataset config: 1 for t+1, 5 for t+5),
# summed over the `target` box, w.r.t. the `input` channel of the initial state.
input: aro_u_250hpa
output: aro_tp_0m
target: null                        # ROI [lon_min, lon_max, lat_min, lat_max]; null = whole grid
extent: null                        # grid [lon_min, lon_max, lat_min, lat_max]; null = from the dataset
list_run_hour: [0, 3, 6, 9, 12, 15, 18, 21]   # analysis hours to use

# Explainers and hyperparameters of the paper (Table 5). Used by explain, compare, eval and time.
explainers:
  BaseGrad: {}
  SmoothGrad: {std_perturbations: 0.2, num_perturbations: 20}
  VarGrad: {std_perturbations: 0.2, num_perturbations: 20}
  IntegratedGrad: {num_steps: 20}
  WassersteinGrad: {std_perturbations: 0.2, num_perturbations: 20, reg: 0.001}      # WGBary
  WassersteinGradMask: {std_perturbations: 0.2, num_perturbations: 20, reg: 0.001}  # WGBary x Grad

eval:
  # Events are kept if the mean `output` truth over `target` at the first lead
  # time is >= precip_threshold (null keeps all events). The paper uses the 100
  # (25 for the ablations) events with the highest precipitation; run the
  # `precip` mode to rank the events and read off the threshold.
  precip_threshold: null
  metrics:
    Sparsity: {}
    ROAD: {std_noise: 0.1, n_random: 5}
    LocalLipschitzEstimate: {std_noise: 0.1, num_iter: 7}

centroid:
  precip_threshold: null
  max_events: 100
  sigma_step: 0.1          # noise levels 0.1, 0.2, ..., 1.0 (fraction of the input range)
  num_noise_levels: 10
  num_monte_carlo: 10
  force_recompute: false   # per-event results are cached in <output_dir>/centroid/cache

transport:
  std_perturbations: 0.2
  num_perturbations: 1     # one figure per perturbation and event
  scale: 16                # downsampling factor before exact OT

precip:
  top_k: 100
